[package]
name = "reth-dtvm-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Reth node with a pluggable EVMC subject backend (DTVM / evmone) as the execution engine"
default-run = "reth-dtvm"

[lints]
workspace = true

[dependencies]
# reth
reth-ethereum-cli.workspace = true
reth-chainspec.workspace = true
reth-cli-util.workspace = true
reth-node-api.workspace = true
reth-node-builder.workspace = true
reth-node-ethereum.workspace = true
reth-node-core.workspace = true
reth-evm-ethereum.workspace = true
reth-evm.workspace = true
reth-ethereum-primitives.workspace = true
reth-ethereum-consensus.workspace = true
reth-provider.workspace = true
reth-engine-local.workspace = true
reth-payload-primitives.workspace = true
alloy-rpc-types-eth.workspace = true
alloy-primitives.workspace = true

# the EVMC subject-backend adapter (DTVM / evmone), same crate used by the
# sealed replay experiments
reth-dtvm-transaction-adapter = { path = "../../adapter-subject-backends/reth-transaction" }

# misc
clap = { workspace = true, features = ["derive", "env"] }
eyre.workspace = true
sha2 = { workspace = true, features = ["std"] }
tracing.workspace = true

[features]
# A reduced subset of the stock `reth` binary's defaults. `jit` is excluded on
# purpose: the revmc JIT would be a second, confounding execution engine in an
# experiment whose whole point is to vary only the EVM. `gmp`,
# `reth-revm/portable`, `js-tracer` and the OTLP features are also absent —
# the first two are performance-relevant, so enable matching features on both
# binaries before comparing this node against stock `reth` on the same datadir.
default = [
    "jemalloc",
    "asm-keccak",
    "keccak-cache-global",
    "min-trace-logs",
]

asm-keccak = [
    "reth-node-core/asm-keccak",
    "reth-ethereum-cli/asm-keccak",
    "reth-node-ethereum/asm-keccak",
    "alloy-primitives/asm-keccak",
]
keccak-cache-global = [
    "reth-node-core/keccak-cache-global",
    "reth-node-ethereum/keccak-cache-global",
    "alloy-primitives/keccak-cache-global",
]
jemalloc = [
    "reth-cli-util/jemalloc",
    "reth-node-core/jemalloc",
    "reth-ethereum-cli/jemalloc",
]
min-trace-logs = [
    "tracing/release_max_level_trace",
    "reth-ethereum-cli/min-trace-logs",
    "reth-node-core/min-trace-logs",
]

[[bin]]
name = "reth-dtvm"
path = "src/main.rs"
