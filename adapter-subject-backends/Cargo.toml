[package]
name = "reth-dtvm-adapter"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false

# Own workspace root: keeps the crate buildable when the checkout sits under
# another cargo workspace's directory tree (e.g. a git worktree of this repo).
[workspace]

[dependencies]
alloy-evm = { version = "=0.37.1", default-features = false, features = ["std"] }
alloy-primitives = { version = "=1.6.1", default-features = false, features = ["std"] }
libloading = "=0.9.0"
revm = { version = "=41.0.0", default-features = false, features = ["std"] }
thiserror = "=2.0.18"

[dev-dependencies]
pretty_assertions = "=1.4.1"
sha2 = "=0.10.9"

[patch.crates-io]
revm-handler = { path = "../patched/revm-handler" }

[profile.dev]
debug = 1

[profile.release]
codegen-units = 1
lto = "thin"
