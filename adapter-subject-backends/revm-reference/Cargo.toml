[package]
name = "revm-osaka-reference"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace]

[dependencies]
alloy-evm = { version = "=0.37.1", default-features = false, features = ["std"] }
alloy-primitives = { version = "=1.6.1", default-features = false, features = ["std"] }
revm = { version = "=41.0.0", default-features = false, features = ["std"] }
revm-inspectors = { version = "=0.41.2", default-features = false, features = ["std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

